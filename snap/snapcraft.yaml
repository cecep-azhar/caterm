name: caterm
base: core22
version: '2.1.11'
summary: Zero-Knowledge SSH Terminal & SFTP Client
description: |
  CATerm is a secure, high-performance terminal and SFTP client powered by Rust
  and SQLite. It features Zero-Knowledge encryption, seamless directory sync,
  and unparalleled speed.

grade: stable
confinement: strict

apps:
  caterm:
    command: caterm
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - home
      - removable-media
      - ssh-keys
      - ssh-public-keys

parts:
  caterm:
    plugin: rust
    source: .
    build-packages:
      - curl
      - libwebkit2gtk-4.1-dev
      - build-essential
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - libssl-dev
      - pkg-config
    override-build: |
      # 1. Setup frontend dependencies (Node.js)
      curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      apt-get install -y nodejs
      
      # 2. Build SvelteKit Frontend
      cd frontend
      npm install
      npm run build
      cd ..

      # 3. Build Tauri binary
      npm install -g @tauri-apps/cli
      cd crates/caterm-app
      npx tauri build --bundles app

      # 4. Copy binary to snap install directory
      mkdir -p $CRAFT_PART_INSTALL/bin
      cp target/release/caterm $CRAFT_PART_INSTALL/bin/caterm
