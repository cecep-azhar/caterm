[package]
name = "caterm-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "CATerm v2 core library — pure Rust, no GUI dependencies. Vault, SSH engine, store, AI copilot logic."

[lib]
name = "caterm_core"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
rand = "0.8"
argon2 = "0.5"
secrecy = "0.8"
zeroize = "1.8"
hex = "0.4"
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1.53.1", features = ["full"] }
async-trait = "0.1.92"
parking_lot = "0.12.5"
once_cell = "1.21.4"
ssh-key = { version = "0.6.7", features = ["ed25519", "rsa", "encryption", "alloc"] }
chrono = "0.4.45"
regex = "1.13.1"
uuid = { version = "1.26.1", features = ["v4"] }
# Blocking HTTP for the LLM endpoint. Replaces shelling out to `curl`, which put the API key
# in the process argv where any local user could read it off the process table.
ureq = { version = "3.1", features = ["json"] }

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
ssh2 = "0.9.6"

[target.'cfg(not(windows))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }

[dev-dependencies]
serde_json.workspace = true
