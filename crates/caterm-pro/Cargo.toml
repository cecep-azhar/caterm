[package]
name = "caterm-pro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "CATerm Pro Extension — Cryptographic license verification, zero-knowledge sync, and GCC unlock handshake."

[lib]
name = "caterm_pro"
path = "src/lib.rs"

[dependencies]
caterm-core = { path = "../caterm-core" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
aes-gcm = "0.10"
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
chrono = "0.4"
ureq = { version = "3.1", features = ["json"] }
regex = "1.13.1"
dirs = "5.0"
once_cell = "1.21.4"
