[package]
name = "caterm-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "CATerm v2 desktop shell — thin Tauri binding layer over caterm-core. No business logic here (K2-1)."

[lib]
name = "caterm_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
caterm-core = { path = "../caterm-core" }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
async-trait = "0.1.92"
parking_lot = "0.12.5"
tokio = { version = "1.53.1", features = ["full"] }
tauri-plugin-shell = "2.3.6"
tauri-plugin-dialog = "2.7.3"
mimalloc = { version = "0.1", default-features = false }
tauri-plugin-process = "2"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
ssh2 = "0.9.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[target.'cfg(not(windows))'.dependencies]
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", default-features = false }

