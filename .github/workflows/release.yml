name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build Tauri (Windows NSIS + MSI)
        run: tauri build
        working-directory: crates/caterm-app
        env:
          # Signs the updater artifacts (*.sig). Public half is plugins.updater.pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.sig
          generate_release_notes: true

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            rpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build Tauri (DEB + RPM + AppImage)
        run: tauri build
        working-directory: crates/caterm-app
        env:
          # Signs the updater artifacts (*.sig). Public half is plugins.updater.pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig

  updater-manifest:
    name: Publish updater manifest (latest.json)
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      # The in-app updater reads releases/latest/download/latest.json: version + one signed
      # installer URL per platform (NSIS on Windows, AppImage on Linux).
      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir sigs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir sigs
          win_sig=$(ls sigs/*-setup.exe.sig | head -n1)
          linux_sig=$(ls sigs/*.AppImage.sig | head -n1)
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          jq -n \
            --arg version "${TAG#v}" \
            --arg notes "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg win_sig "$(cat "$win_sig")" \
            --arg win_url "${base}/$(basename "${win_sig%.sig}")" \
            --arg linux_sig "$(cat "$linux_sig")" \
            --arg linux_url "${base}/$(basename "${linux_sig%.sig}")" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {
                "windows-x86_64": {signature: $win_sig, url: $win_url},
                "linux-x86_64": {signature: $linux_sig, url: $linux_url}}}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"

  notify-release:
    name: Notify Release (GCC & n8n)
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GCC Release Notification
        env:
          GCC_API_KEY: ${{ secrets.GCC_API_KEY }}
          VERSION: ${{ github.ref_name }}
          CHANGELOG_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          curl -f -s -X POST "https://gcc.fathforce.com/api/v1/newsletter/notify" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${GCC_API_KEY}" \
            -d "{\"version\": \"${VERSION}\", \"changelog_url\": \"${CHANGELOG_URL}\"}"

